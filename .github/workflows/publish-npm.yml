name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, such as v0.3.2"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package version
        run: |
          expected_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          expected_version="${expected_tag#v}"
          if [[ -z "$expected_version" ]]; then
            echo "Could not determine expected package version from tag."
            exit 1
          fi

          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "package.json version $actual_version does not match expected version $expected_version"
            exit 1
          fi

      - name: Run checks
        run: npm run check

      - name: Run smoke test
        run: npm run smoke

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --provenance --access public
