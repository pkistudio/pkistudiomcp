name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish, for example 0.0.6"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify package version
        run: |
          actual_version="$(node -p "require('./package.json').version")"
          if [[ "$actual_version" != "${{ inputs.version }}" ]]; then
            echo "package.json version $actual_version does not match workflow input ${{ inputs.version }}"
            exit 1
          fi

      - name: Run checks
        run: npm run check

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish package
        run: npm publish --access public
